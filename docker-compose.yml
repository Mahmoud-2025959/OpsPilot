# OpsPilot - local backing services (plan, "Compose Docker").
#
# Brings up everything the application can talk to in development: SQL Server, the Seq log
# sink, the RabbitMQ broker the outbox publishes to, and the Redis instance reserved for a
# future cache. Only SQL Server and Seq are required to run the solution; RabbitMQ is needed
# only when RabbitMq:Enabled is set (and the outbox otherwise logs), and Redis is not wired at
# all yet - it is here so raising it does not mean editing this file later.
#
# Usage:
#   copy .env.example .env      (then edit the passwords)
#   docker compose up -d
#   docker compose --profile mail up -d   (adds smtp4dev)
#
# Services:
#   SQL Server  localhost:1433
#   Seq UI      http://localhost:8081   (ingestion on 5341)
#   RabbitMQ    localhost:5672 (AMQP) and http://localhost:15672 (management UI)
#   Redis       localhost:6379
#   API         http://localhost:8080   (optional; built from ./Dockerfile)
#   smtp4dev    http://localhost:3000   (profile `mail`; SMTP on localhost:2525)

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: opspilot-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # SA password comes from the environment so it never lands in this file. It must satisfy
      # SQL Server's complexity rule: at least eight characters drawn from three of the four
      # categories (upper, lower, digit, symbol).
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    container_name: opspilot-seq
    environment:
      ACCEPT_EULA: "Y"
      # No login on the local UI; a real deployment sets authentication and a base URI.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      # 5341 is where the application posts logs; 8081 is the browser UI.
      - "5341:5341"
      - "8081:80"
    volumes:
      - seqdata:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: opspilot-rabbitmq
    environment:
      # Defaults to the guest/guest pair a vanilla image provisions, overridable in .env. Note
      # that the guest account can only connect from localhost, which is exactly the local case.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      # 5672 is AMQP; 15672 is the management UI (http://localhost:15672).
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    # A password is optional locally; set one in .env to match a deployment that has it.
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
               redis-server --requirepass "$$REDIS_PASSWORD";
             else
               redis-server;
             fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: opspilot-smtp4dev
    profiles: ["mail"]
    environment:
      ServerOptions__HostName: smtp4dev
    ports:
      - "3000:80"
      - "2525:25"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opspilot-api
    depends_on:
      sqlserver:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      HttpsRedirection__Enabled: "false"
      Database__MigrateOnStartup: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OpsPilot;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      JWT__SIGNINGKEY: ${JWT__SIGNINGKEY}
      JWT__Issuer: OpsPilot
      JWT__Audience: OpsPilot.Client
      APIKEYENCRYPTION__KEY: ${APIKEYENCRYPTION__KEY}
      RabbitMq__Enabled: "true"
      RabbitMq__ConsumerEnabled: "true"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: /
      RabbitMq__UserName: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      RabbitMq__UseTls: "false"
      Hangfire__Enabled: "true"
      Hangfire__DashboardEnabled: "true"
      Hangfire__DashboardPath: /jobs
      Hangfire__DashboardUsername: ${HANGFIRE_DASHBOARD_USER:-ops}
      Hangfire__DashboardPassword: ${HANGFIRE_DASHBOARD_PASSWORD}
      Smtp__Enabled: ${SMTP_ENABLED:-false}
      Smtp__Host: smtp4dev
      Smtp__Port: "25"
      Smtp__UseStartTls: "false"
      Smtp__From: no-reply@ops-pilot.test
      Smtp__FromName: OpsPilot
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  sqldata:
  seqdata:
  rabbitmqdata:
  redisdata:
